[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-web-cli"
version = "0.1.0"
description = "Gemini web app from the command line. JSON on stdout, logs on stderr."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gemini-webapi[browser]>=2.1.1",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
gemini-web-cli = "gemini_web_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_cli"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Typer options are function calls in defaults by design.
"src/gemini_web_cli/cli.py" = ["B008"]
"src/gemini_web_cli/commands/*.py" = ["B008", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
